<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MelviLens · Multi‑language Voice & Translation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #c0d4f0, #a8bbdf);
            font-family: -apple-system, 'SF Pro Text', 'Inter', system-ui, 'Segoe UI', Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .glass-card {
            max-width: 760px;
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 0.5px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
        }

        .glass-header {
            padding: 1.6rem 1.8rem 0.6rem 1.8rem;
            text-align: center;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title-area {
            text-align: left;
        }

        .glass-header h1 {
            font-weight: 590;
            font-size: 1.9rem;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1c2e3f, #2c4c6e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .glass-header p {
            font-size: 0.75rem;
            color: #2c3e4e;
            opacity: 0.7;
            font-weight: 470;
            margin-top: 4px;
        }

        .ui-lang-toggle {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 0.2rem;
            display: inline-flex;
            border: 0.5px solid rgba(255, 255, 255, 0.6);
        }

        .toggle-btn {
            background: transparent;
            border: none;
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            color: #2c4e6e;
            transition: all 0.2s;
            font-family: inherit;
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.8);
            color: #1f3e54;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .pair-btn {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(255, 255, 255, 0.7);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1f3e54;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .pair-btn.active {
            background: #1f3e54;
            color: white;
            border-color: #1f3e54;
            box-shadow: 0 4px 12px rgba(31, 62, 84, 0.35);
            font-weight: 600;
            transform: scale(1.02);
        }

        .pair-btn:not(.active):hover {
            background: rgba(255, 255, 255, 0.65);
            border-color: rgba(255, 255, 255, 0.9);
        }

        .main-panel {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
        }

        .output-section {
            order: 1;
        }

        .output-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            color: #2c4c6e;
            margin-bottom: 8px;
            margin-left: 8px;
            opacity: 0.7;
            display: flex;
            justify-content: space-between;
        }

        .refresh-note {
            font-size: 0.65rem;
            color: #6c8eaa;
            background: rgba(255, 255, 255, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }

        .translation-glass {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 1.2rem 1.4rem;
            border: 0.5px solid rgba(255, 255, 255, 0.7);
            transition: all 0.2s;
            cursor: pointer;
            min-height: 110px;
            display: flex;
            align-items: center;
        }

        .translation-glass:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        .translation-text {
            font-size: 1.05rem;
            line-height: 1.45;
            color: #1e2f3c;
            font-weight: 470;
            word-break: break-word;
            flex: 1;
        }

        .copy-hint {
            font-size: 0.65rem;
            color: #4a6a84;
            margin-top: 6px;
            text-align: right;
            opacity: 0.5;
        }

        .input-section {
            order: 2;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            margin-left: 6px;
            margin-right: 6px;
            gap: 8px;
        }

        .input-label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #2c4c6e;
            opacity: 0.7;
        }

        .voice-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .voice-lang-toggle {
            background: rgba(255, 255, 255, 0.5);
            border: 0.5px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            cursor: pointer;
            color: #1f3e54;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
        }

        .voice-lang-toggle:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .voice-button {
            background: rgba(255, 255, 255, 0.5);
            border: 0.5px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1f3e54;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .voice-button:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .voice-button.listening {
            background: #ff5e5e;
            color: white;
            animation: earPulse 0.9s infinite ease-in-out;
        }

        @keyframes earPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 94, 94, 0.5);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 0 0 6px rgba(255, 94, 94, 0.2);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 94, 94, 0);
            }
        }

        @keyframes earWave {
            0% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(8deg);
            }
            75% {
                transform: rotate(-8deg);
            }
            100% {
                transform: rotate(0deg);
            }
        }

        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            border: 0.5px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            padding: 1rem 1.2rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1a2c3b;
            resize: vertical;
            outline: none;
            transition: all 0.2s;
            line-height: 1.4;
        }

        textarea:focus {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(100, 150, 200, 0.6);
            box-shadow: 0 0 0 3px rgba(70, 130, 200, 0.1);
        }

        textarea::placeholder {
            color: #6c8eaa;
            font-size: 0.85rem;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 12px;
            font-size: 0.7rem;
            color: #2c4e6e;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 470;
        }

        .copy-action {
            background: transparent;
            border: none;
            font-size: 0.7rem;
            color: #2c6e9e;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            transition: background 0.2s;
        }

        .copy-action:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .example-row {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .example-chip {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #1f4e6e;
            cursor: pointer;
            transition: all 0.15s;
        }

        .example-chip:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30, 40, 50, 0.85);
            backdrop-filter: blur(20px);
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 200;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 550px) {
            .glass-card {
                border-radius: 36px;
            }
            .main-panel {
                padding: 1.2rem;
            }
            .header-top {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .title-area {
                text-align: center;
            }
            .ui-lang-toggle {
                align-self: center;
            }
            .mode-selector {
                flex-wrap: wrap;
            }
            .toast {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="glass-header">
            <div class="header-top">
                <div class="title-area">
                    <h1>⟳ MelviLens</h1>
                    <p id="subtitleText">FR↔EN · auto‑stop voice · accurate translation</p>
                </div>
                <div class="ui-lang-toggle">
                    <button id="toggleFrenchBtn" class="toggle-btn active">🇫🇷 FR</button>
                    <button id="toggleEnglishBtn" class="toggle-btn">🇬🇧 EN</button>
                </div>
            </div>
            <div class="mode-selector">
                <button data-pair="fr-en" class="pair-btn active">🇫🇷 ↔ 🇬🇧</button>
                <button data-pair="de-en" class="pair-btn">🇩🇪 ↔ 🇬🇧</button>
                <button data-pair="fr-de" class="pair-btn">🇫🇷 ↔ 🇩🇪</button>
            </div>
        </div>

        <div class="main-panel">
            <div class="output-section">
                <div class="output-label">
                    <span id="translationLabel">traduction</span>
                    <span class="refresh-note" id="refreshNote">⏎ reset après 2 min</span>
                </div>
                <div id="translationBox" class="translation-glass" style="cursor: pointer">
                    <div class="translation-text" id="translationResult">✨ prêt</div>
                </div>
                <div class="copy-hint" id="copyHintText">↻ cliquer pour copier</div>
            </div>

            <div class="input-section">
                <div class="input-header">
                    <span class="input-label" id="inputLabelText">tapez ou parlez (auto‑stop)</span>
                    <div class="voice-controls">
                        <span id="voiceLangToggle" class="voice-lang-toggle" title="Changer la langue du micro">🇫🇷</span>
                        <button id="voiceBtn" class="voice-button">🎤 Parler</button>
                    </div>
                </div>
                <textarea id="sourceInput" rows="2" placeholder="Parlez ou tapez... le micro s'arrête tout seul"></textarea>

                <div class="status-row">
                    <div class="status-badge" id="statusIndicator">⚡ prêt</div>
                    <button id="copyTextBtn" class="copy-action">📋 copier</button>
                </div>

                <div class="example-row" id="exampleContainer"></div>
            </div>
        </div>
    </div>

    <div id="toastMsg" class="toast">📋 Copié !</div>

    <script>
        (function () {
            // ---------- DOM elements ----------
            const sourceTextarea = document.getElementById('sourceInput');
            const translationDiv = document.getElementById('translationResult');
            const translationBox = document.getElementById('translationBox');
            const statusSpan = document.getElementById('statusIndicator');
            const voiceButton = document.getElementById('voiceBtn');
            const voiceLangToggle = document.getElementById('voiceLangToggle');
            const copyTextBtn = document.getElementById('copyTextBtn');
            const toastEl = document.getElementById('toastMsg');
            const toggleFrenchBtn = document.getElementById('toggleFrenchBtn');
            const toggleEnglishBtn = document.getElementById('toggleEnglishBtn');
            const subtitleEl = document.getElementById('subtitleText');
            const translationLabel = document.getElementById('translationLabel');
            const copyHintSpan = document.getElementById('copyHintText');
            const inputLabelText = document.getElementById('inputLabelText');
            const exampleContainer = document.getElementById('exampleContainer');
            const refreshNote = document.getElementById('refreshNote');
            const pairButtons = document.querySelectorAll('.pair-btn');

            // ---------- i18n UI strings ----------
            const localeText = {
                fr: {
                    subtitle: "FR↔EN · arrêt vocal automatique · traduction précise",
                    translationLabel: "traduction",
                    copyHint: "↻ cliquer pour copier",
                    inputLabel: "tapez ou parlez (auto‑stop)",
                    statusReady: "⚡ prêt",
                    statusTranslating: "🌐 traduction...",
                    statusCached: "✓ (cache persistant)",
                    statusError: "⚠️ erreur",
                    copyToast: "📋 Copié !",
                    voiceListening: "🔴 Écoute... (auto‑stop)",
                    voiceSpeak: "🎤 Parler",
                    placeholder: "Parlez ou tapez... le micro s'arrête tout seul",
                    refreshNote: "⏎ reset après 2min",
                    offlineAvailable: "📚 appris hors ligne",
                },
                en: {
                    subtitle: "FR↔EN · auto‑stop voice · accurate translation",
                    translationLabel: "translation",
                    copyHint: "↻ click to copy",
                    inputLabel: "type or speak (auto‑stop)",
                    statusReady: "⚡ ready",
                    statusTranslating: "🌐 translating...",
                    statusCached: "✓ (persistent cache)",
                    statusError: "⚠️ error",
                    copyToast: "📋 Copied!",
                    voiceListening: "🔴 Listening... (auto‑stop)",
                    voiceSpeak: "🎤 Speak",
                    placeholder: "Speak or type... mic stops automatically",
                    refreshNote: "⏎ reset after 2min",
                    offlineAvailable: "📚 learned offline",
                },
            };

            let currentLang = 'fr'; // UI language
            let currentPair = 'fr-en'; // translation pair
            let voiceLang = 'fr'; // currently set microphone language

            // ---------- Helpers ----------
            function showToast(msg, duration = 1600) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                if (window.toastTimeout) clearTimeout(window.toastTimeout);
                window.toastTimeout = setTimeout(() => toastEl.classList.remove('show'), duration);
            }

            function setStatus(text, isError = false, isCache = false) {
                statusSpan.innerHTML = text;
                statusSpan.style.background = isError
                    ? 'rgba(255, 200, 200, 0.5)'
                    : isCache
                    ? 'rgba(200, 240, 200, 0.5)'
                    : 'rgba(255,255,255,0.4)';
            }

            // ---------- Language detection (fr, en, de) ----------
            function detectLanguage(text) {
                const lower = text.toLowerCase();
                const hasFrenchAccents = /[éèêëàâôûçîïœ]/i.test(text);
                const hasGermanChars = /[äöüß]/i.test(text);

                const frenchWords = [
                    'le', 'la', 'les', 'un', 'une', 'de', 'du', 'des', 'et', 'est', 'je', 'tu', 'il', 'elle',
                    'nous', 'vous', 'ils', 'elles', 'ce', 'cette', 'que', 'qui', 'dans', 'pour', 'par', 'avec',
                    'sans', 'sur', 'bonjour', 'merci',
                ];
                const englishWords = [
                    'the', 'and', 'of', 'to', 'in', 'for', 'on', 'with', 'be', 'by', 'this', 'that', 'you',
                    'are', 'is', 'it', 'have', 'not', 'from', 'or', 'but', 'so', 'as', 'at', 'we', 'they',
                    'he', 'she', 'good', 'morning', 'thank',
                ];
                const germanWords = [
                    'der', 'die', 'das', 'und', 'ist', 'ich', 'nicht', 'sie', 'er', 'es', 'wir', 'ihr', 'ein',
                    'eine', 'einen', 'aber', 'auch', 'wie', 'was', 'wo', 'auf', 'mit', 'von', 'zu', 'in', 'für',
                    'dass', 'sein', 'haben', 'werden', 'können', 'guten', 'morgen', 'danke', 'bitte', 'hallo',
                ];

                let frScore = 0,
                    enScore = 0,
                    deScore = 0;
                if (hasFrenchAccents) frScore += 3;
                if (hasGermanChars) deScore += 3;

                const words = lower.split(/\s+/);
                for (let w of words) {
                    if (frenchWords.includes(w)) frScore++;
                    if (englishWords.includes(w)) enScore++;
                    if (germanWords.includes(w)) deScore++;
                }

                if (frScore >= enScore && frScore >= deScore) return 'fr';
                if (enScore >= deScore) return 'en';
                return 'de';
            }

            function getSourceTarget(text) {
                const [lang1, lang2] = currentPair.split('-');
                const detected = detectLanguage(text);
                if (detected === lang1) return { source: lang1, target: lang2 };
                if (detected === lang2) return { source: lang2, target: lang1 };
                // fallback: choose first language of pair as source
                return { source: lang1, target: lang2 };
            }

            // ---------- Persistent cache (IndexedDB) ----------
            const DB_NAME = 'MelviLensDB';
            const STORE_NAME = 'translations';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        db = request.result;
                        resolve(db);
                    };
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'original' });
                        }
                    };
                });
            }

            async function loadFromPersistentCache(original) {
                if (!db) await openDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const getReq = store.get(original);
                    getReq.onsuccess = () => resolve(getReq.result ? getReq.result.translated : null);
                    getReq.onerror = () => resolve(null);
                });
            }

            async function saveToPersistentCache(original, translated) {
                if (!db) await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ original, translated });
            }

            // ---------- Translation API ----------
            const API_URL = 'https://api.mymemory.translated.net/get';
            const DEBOUNCE_MS = 280;
            let debounceTimer = null;
            let currentAbort = null;

            async function translateText(original) {
                const trimmed = original.trim();
                if (trimmed === '') {
                    translationDiv.innerText = '✨ ' + (currentLang === 'fr' ? 'prêt' : 'ready');
                    setStatus(localeText[currentLang].statusReady);
                    return;
                }

                const cached = await loadFromPersistentCache(trimmed);
                if (cached) {
                    translationDiv.innerText = cached;
                    setStatus(localeText[currentLang].statusCached, false, true);
                    return;
                }

                const { source, target } = getSourceTarget(trimmed);
                const langPair = `${source}|${target}`;
                const directionIcon = `${source.toUpperCase()}→${target.toUpperCase()}`;

                if (currentAbort) currentAbort.abort();
                const controller = new AbortController();
                currentAbort = controller;
                setStatus(`${localeText[currentLang].statusTranslating} ${directionIcon}`);
                translationDiv.innerText = '🔄 ...';

                try {
                    const params = new URLSearchParams({
                        q: trimmed,
                        langpair: langPair,
                        de: 'melvilens@demo.com',
                        mt: '1',
                    });
                    const response = await fetch(`${API_URL}?${params.toString()}`, { signal: controller.signal });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    let translated = data?.responseData?.translatedText;

                    if (!translated || translated === trimmed) {
                        try {
                            const libreUrl = 'https://libretranslate.com/translate';
                            const libreResponse = await fetch(libreUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    q: trimmed,
                                    source: source,
                                    target: target,
                                    format: 'text',
                                }),
                                signal: controller.signal,
                            });
                            if (libreResponse.ok) {
                                const libreData = await libreResponse.json();
                                if (libreData.translatedText) translated = libreData.translatedText;
                            }
                        } catch (e) { /* ignore */ }
                    }

                    if (!translated || translated === trimmed) {
                        translated =
                            source === 'fr'
                                ? '⚠️ Traduction non disponible'
                                : source === 'de'
                                ? '⚠️ Übersetzung nicht verfügbar'
                                : '⚠️ Translation unavailable';
                    }

                    const clean = translated
                        .replace(/&quot;/g, '"')
                        .replace(/&#39;/g, "'")
                        .replace(/&amp;/g, '&');
                    translationDiv.innerText = clean;
                    await saveToPersistentCache(trimmed, clean);
                    setStatus(`✓ ${directionIcon}`, false, false);
                    showToast(localeText[currentLang].offlineAvailable, 1200);
                } catch (err) {
                    if (err.name === 'AbortError') return;
                    console.warn(err);
                    translationDiv.innerText =
                        '⚠️ ' + (currentLang === 'fr' ? 'hors ligne · non appris' : 'offline · not learned');
                    setStatus(localeText[currentLang].statusError, true);
                } finally {
                    if (currentAbort === controller) currentAbort = null;
                }
            }

            function handleInput() {
                resetInactivityTimer();
                const val = sourceTextarea.value;
                if (debounceTimer) clearTimeout(debounceTimer);
                if (val.trim() === '') {
                    translationDiv.innerText = '✨ ' + (currentLang === 'fr' ? 'prêt' : 'ready');
                    setStatus(localeText[currentLang].statusReady);
                    if (currentAbort) currentAbort.abort();
                    return;
                }
                debounceTimer = setTimeout(() => translateText(val), DEBOUNCE_MS);
            }

            // ---------- Voice recognition (auto‑stop) ----------
            let recognition = null;
            let isListening = false;
            let silenceTimer = null;
            const SILENCE_DELAY = 1500;

            function initSpeechRecognition(langCode) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    voiceButton.disabled = true;
                    voiceButton.style.opacity = '0.5';
                    showToast('Voice not supported in this browser', 2000);
                    return null;
                }
                const recog = new SpeechRecognition();
                recog.continuous = true;
                recog.interimResults = true;
                recog.lang = langCode;
                recog.maxAlternatives = 1;
                return recog;
            }

            function resetSilenceTimer() {
                if (silenceTimer) clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    if (isListening && recognition) {
                        recognition.stop();
                        showToast(
                            currentLang === 'fr' ? '🎤 Silence détecté, arrêt automatique' : '🎤 Silence detected, auto-stopping',
                            1500
                        );
                    }
                }, SILENCE_DELAY);
            }

            function startVoice() {
                const langCodeMap = { fr: 'fr-FR', en: 'en-US', de: 'de-DE' };
                const recogLang = langCodeMap[voiceLang] || 'fr-FR';
                if (recognition) recognition.abort();
                recognition = initSpeechRecognition(recogLang);
                if (!recognition) return;

                recognition.onstart = () => {
                    isListening = true;
                    voiceButton.classList.add('listening');
                    voiceButton.innerHTML = `🔴 ${localeText[currentLang].voiceListening} <span style="display:inline-block; animation: earWave 0.7s infinite;">👂</span>`;
                    resetSilenceTimer();
                };

                recognition.onerror = (event) => {
                    if (event.error === 'aborted') return;
                    isListening = false;
                    voiceButton.classList.remove('listening');
                    voiceButton.innerHTML = `🎙️ ${localeText[currentLang].voiceSpeak}`;
                    showToast(`🎤 ${event.error === 'not-allowed' ? 'Microphone access denied' : 'Error, try again'}`, 1500);
                    if (silenceTimer) clearTimeout(silenceTimer);
                };

                recognition.onend = () => {
                    isListening = false;
                    voiceButton.classList.remove('listening');
                    voiceButton.innerHTML = `🎙️ ${localeText[currentLang].voiceSpeak}`;
                    if (silenceTimer) clearTimeout(silenceTimer);
                };

                recognition.onresult = (event) => {
                    resetSilenceTimer();
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            const transcript = event.results[i][0].transcript.trim();
                            if (transcript) {
                                sourceTextarea.value = transcript;
                                resetInactivityTimer();
                                if (debounceTimer) clearTimeout(debounceTimer);
                                if (currentAbort) currentAbort.abort();
                                translateText(transcript);
                                showToast(`👂 "${transcript.substring(0, 40)}"`, 1200);
                            }
                        }
                    }
                };
                recognition.start();
            }

            function stopVoice() {
                if (recognition) recognition.stop();
            }

            function toggleVoice() {
                if (isListening) {
                    stopVoice();
                } else {
                    startVoice();
                }
            }

            // ---------- Voice language toggle ----------
            function updateVoiceLangDisplay() {
                const flagMap = { fr: '🇫🇷', en: '🇬🇧', de: '🇩🇪' };
                voiceLangToggle.textContent = flagMap[voiceLang] || '🇫🇷';
            }

            function cycleVoiceLang() {
                const [lang1, lang2] = currentPair.split('-');
                voiceLang = voiceLang === lang1 ? lang2 : lang1;
                updateVoiceLangDisplay();
                showToast(`🎤 Micro: ${voiceLang.toUpperCase()}`, 1000);
                if (isListening) {
                    stopVoice();
                    setTimeout(startVoice, 200);
                }
            }

            // ---------- Auto refresh after inactivity ----------
            let inactivityTimer = null;
            const INACTIVITY_LIMIT = 120000;

            function resetInactivityTimer() {
                if (inactivityTimer) clearTimeout(inactivityTimer);
                inactivityTimer = setTimeout(() => {
                    sourceTextarea.value = '';
                    translationDiv.innerText = '✨ ' + (currentLang === 'fr' ? 'prêt' : 'ready');
                    setStatus(localeText[currentLang].statusReady);
                    if (currentAbort) currentAbort.abort();
                    if (debounceTimer) clearTimeout(debounceTimer);
                    showToast(
                        currentLang === 'fr' ? '🔄 Réinitialisation auto (inactivité)' : '🔄 Auto-refresh (inactivity)',
                        2000
                    );
                }, INACTIVITY_LIMIT);
            }

            function bindActivityEvents() {
                const events = ['click', 'keydown', 'input', 'touchstart'];
                events.forEach((ev) => document.addEventListener(ev, resetInactivityTimer));
                resetInactivityTimer();
            }

            // ---------- Copy translation ----------
            async function copyTranslation() {
                const text = translationDiv.innerText;
                if (!text || text.includes('✨') || text.includes('🔄') || text.includes('⚠️')) {
                    showToast(currentLang === 'fr' ? 'Rien à copier' : 'Nothing to copy', 1000);
                    return;
                }
                try {
                    await navigator.clipboard.writeText(text);
                    showToast(localeText[currentLang].copyToast, 1200);
                    setStatus(localeText[currentLang].statusReady);
                } catch (err) {
                    showToast('❌ Copy failed', 1000);
                }
            }

            // ---------- UI language toggle ----------
            function setUILanguage(lang) {
                currentLang = lang;
                if (lang === 'fr') {
                    toggleFrenchBtn.classList.add('active');
                    toggleEnglishBtn.classList.remove('active');
                } else {
                    toggleEnglishBtn.classList.add('active');
                    toggleFrenchBtn.classList.remove('active');
                }
                updateUI();
            }

            // ---------- Translation pair selection ----------
            function setPair(pair) {
                currentPair = pair;
                pairButtons.forEach((btn) => {
                    btn.classList.toggle('active', btn.dataset.pair === pair);
                });
                // reset voice language to first language of the pair
                const [lang1] = pair.split('-');
                voiceLang = lang1;
                updateVoiceLangDisplay();
                updateUI();
                // re-translate if there is text
                if (sourceTextarea.value.trim() !== '') {
                    if (debounceTimer) clearTimeout(debounceTimer);
                    if (currentAbort) currentAbort.abort();
                    translateText(sourceTextarea.value);
                }
            }

            // ---------- Update examples based on pair & UI lang ----------
            const examplesMap = {
                'fr-en': [
                    { text: 'Bonjour, comment allez-vous ?', label: '🇫🇷 Bonjour' },
                    { text: 'What a beautiful day', label: '🇬🇧 beautiful day' },
                    { text: 'Je vais au cinéma ce soir', label: '🇫🇷 cinéma' },
                    { text: 'I love minimal design', label: '🇬🇧 minimal design' },
                ],
                'de-en': [
                    { text: 'Guten Morgen, wie geht es Ihnen?', label: '🇩🇪 Guten Morgen' },
                    { text: 'What a beautiful day', label: '🇬🇧 beautiful day' },
                    { text: 'Ich liebe gutes Design', label: '🇩🇪 Design' },
                    { text: 'I love minimal style', label: '🇬🇧 minimal style' },
                ],
                'fr-de': [
                    { text: 'Bonjour, comment allez-vous ?', label: '🇫🇷 Bonjour' },
                    { text: 'Guten Morgen, wie geht es Ihnen?', label: '🇩🇪 Guten Morgen' },
                    { text: "J'aime le design épuré", label: '🇫🇷 design épuré' },
                    { text: 'Ich mag klares Design', label: '🇩🇪 klares Design' },
                ],
            };

            function updateExamples() {
                const examples = examplesMap[currentPair] || examplesMap['fr-en'];
                exampleContainer.innerHTML = examples
                    .map(
                        (ex) =>
                            `<span class="example-chip" data-example="${ex.text}">${ex.label}</span>`
                    )
                    .join('');
                document.querySelectorAll('.example-chip').forEach((chip) => {
                    chip.addEventListener('click', () => {
                        const exampleText = chip.getAttribute('data-example');
                        if (exampleText) {
                            sourceTextarea.value = exampleText;
                            if (debounceTimer) clearTimeout(debounceTimer);
                            if (currentAbort) currentAbort.abort();
                            translateText(exampleText);
                            sourceTextarea.focus();
                        }
                    });
                });
            }

            // ---------- UI update (labels, subtitle) ----------
            function updateUI() {
                const t = localeText[currentLang];
                // Subtitle with current pair
                const pairDisplay = currentPair.replace('-', '↔').toUpperCase();
                subtitleEl.textContent = `${pairDisplay} · ${t.subtitle.split('·')[1]?.trim() || 'auto‑stop voice · accurate translation'}`;
                translationLabel.textContent = t.translationLabel;
                copyHintSpan.textContent = t.copyHint;
                inputLabelText.textContent = t.inputLabel;
                sourceTextarea.placeholder = t.placeholder;
                refreshNote.textContent = t.refreshNote;
                if (!voiceButton.classList.contains('listening')) {
                    voiceButton.innerHTML = `🎙️ ${t.voiceSpeak}`;
                } else {
                    voiceButton.innerHTML = `🔴 ${t.voiceListening} <span style="display:inline-block; animation: earWave 0.7s infinite;">👂</span>`;
                }
                updateExamples();
                const currentStatus = statusSpan.innerText;
                if (currentStatus.includes('prêt') || currentStatus.includes('ready')) statusSpan.innerHTML = t.statusReady;
                else if (currentStatus.includes('traduction') || currentStatus.includes('translating'))
                    statusSpan.innerHTML = t.statusTranslating;
                else if (currentStatus.includes('cache')) statusSpan.innerHTML = t.statusCached;
                else if (currentStatus.includes('erreur') || currentStatus.includes('error'))
                    statusSpan.innerHTML = t.statusError;
            }

            // ---------- Initialization ----------
            async function init() {
                await openDB();
                bindActivityEvents();
                sourceTextarea.addEventListener('input', handleInput);
                voiceButton.addEventListener('click', toggleVoice);
                voiceLangToggle.addEventListener('click', cycleVoiceLang);
                copyTextBtn.addEventListener('click', copyTranslation);
                translationBox.addEventListener('click', copyTranslation);
                toggleFrenchBtn.addEventListener('click', () => setUILanguage('fr'));
                toggleEnglishBtn.addEventListener('click', () => setUILanguage('en'));
                pairButtons.forEach((btn) => {
                    btn.addEventListener('click', () => setPair(btn.dataset.pair));
                });
                setUILanguage('fr');
                setPair('fr-en');
            }

            init();
        })();
    </script>
</body>
</html>
