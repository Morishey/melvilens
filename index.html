<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MelviLens · Auto-Stop Voice & Accurate Translation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #c0d4f0, #a8bbdf);
      font-family: -apple-system, 'SF Pro Text', 'Inter', system-ui, 'Segoe UI', Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .glass-card {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border-radius: 48px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02), inset 0 1px 0 rgba(255,255,255,0.6);
      border: 0.5px solid rgba(255, 255, 255, 0.6);
      overflow: hidden;
    }

    .glass-header {
      padding: 1.6rem 1.8rem 0.8rem 1.8rem;
      text-align: center;
      border-bottom: 0.5px solid rgba(255,255,255,0.3);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-area {
      text-align: left;
    }

    .glass-header h1 {
      font-weight: 590;
      font-size: 1.9rem;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #1c2e3f, #2c4c6e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .glass-header p {
      font-size: 0.75rem;
      color: #2c3e4e;
      opacity: 0.7;
      font-weight: 470;
      margin-top: 4px;
    }

    .lang-toggle {
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 0.2rem;
      display: inline-flex;
      border: 0.5px solid rgba(255,255,255,0.6);
    }

    .toggle-btn {
      background: transparent;
      border: none;
      padding: 0.4rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 40px;
      cursor: pointer;
      color: #2c4e6e;
      transition: all 0.2s;
      font-family: inherit;
    }

    .toggle-btn.active {
      background: rgba(255,255,255,0.8);
      color: #1f3e54;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .main-panel {
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    .output-section {
      order: 1;
    }

    .output-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
      color: #2c4c6e;
      margin-bottom: 8px;
      margin-left: 8px;
      opacity: 0.7;
      display: flex;
      justify-content: space-between;
    }

    .refresh-note {
      font-size: 0.65rem;
      color: #6c8eaa;
      background: rgba(255,255,255,0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
    }

    .translation-glass {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 1.2rem 1.4rem;
      border: 0.5px solid rgba(255,255,255,0.7);
      transition: all 0.2s;
      cursor: pointer;
      min-height: 110px;
      display: flex;
      align-items: center;
    }

    .translation-glass:hover {
      background: rgba(255, 255, 255, 0.7);
    }

    .translation-text {
      font-size: 1.05rem;
      line-height: 1.45;
      color: #1e2f3c;
      font-weight: 470;
      word-break: break-word;
      flex: 1;
    }

    .copy-hint {
      font-size: 0.65rem;
      color: #4a6a84;
      margin-top: 6px;
      text-align: right;
      opacity: 0.5;
    }

    .input-section {
      order: 2;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      margin-left: 6px;
      margin-right: 6px;
    }

    .input-label {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #2c4c6e;
      opacity: 0.7;
    }

    .voice-button {
      background: rgba(255,255,255,0.5);
      border: 0.5px solid rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 0.3rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #1f3e54;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }

    .voice-button:hover {
      background: rgba(255,255,255,0.8);
    }

    .voice-button.listening {
      background: #ff5e5e;
      color: white;
      animation: earPulse 0.9s infinite ease-in-out;
    }

    @keyframes earPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 94, 94, 0.5); }
      50% { transform: scale(1.02); box-shadow: 0 0 0 6px rgba(255, 94, 94, 0.2); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 94, 94, 0); }
    }

    @keyframes earWave {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(8deg); }
      75% { transform: rotate(-8deg); }
      100% { transform: rotate(0deg); }
    }

    textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      border: 0.5px solid rgba(255,255,255,0.7);
      border-radius: 28px;
      padding: 1rem 1.2rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: #1a2c3b;
      resize: vertical;
      outline: none;
      transition: all 0.2s;
      line-height: 1.4;
    }

    textarea:focus {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(100, 150, 200, 0.6);
      box-shadow: 0 0 0 3px rgba(70, 130, 200, 0.1);
    }

    textarea::placeholder {
      color: #6c8eaa;
      font-size: 0.85rem;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 12px;
      font-size: 0.7rem;
      color: #2c4e6e;
    }

    .status-badge {
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(8px);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-weight: 470;
    }

    .copy-action {
      background: transparent;
      border: none;
      font-size: 0.7rem;
      color: #2c6e9e;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      transition: background 0.2s;
    }

    .copy-action:hover {
      background: rgba(255,255,255,0.5);
    }

    .example-row {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .example-chip {
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(8px);
      padding: 0.25rem 0.9rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #1f4e6e;
      cursor: pointer;
      transition: all 0.15s;
    }

    .example-chip:hover {
      background: rgba(255,255,255,0.7);
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30, 40, 50, 0.85);
      backdrop-filter: blur(20px);
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      font-size: 0.8rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 550px) {
      .glass-card { border-radius: 36px; }
      .main-panel { padding: 1.2rem; }
      .glass-header { flex-direction: column; align-items: stretch; text-align: center; }
      .title-area { text-align: center; }
      .lang-toggle { align-self: center; }
      .toast { white-space: nowrap; font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<div class="glass-card">
  <div class="glass-header">
    <div class="title-area">
      <h1>⟳ MelviLens</h1>
      <p id="subtitleText">FR↔EN · arrêt vocal automatique · traduction précise</p>
    </div>
    <div class="lang-toggle">
      <button id="toggleFrenchBtn" class="toggle-btn active">🇫🇷 FR</button>
      <button id="toggleEnglishBtn" class="toggle-btn">🇬🇧 EN</button>
    </div>
  </div>

  <div class="main-panel">
    <div class="output-section">
      <div class="output-label">
        <span id="translationLabel">traduction</span>
        <span class="refresh-note" id="refreshNote">⏎ reset après 2min</span>
      </div>
      <div id="translationBox" class="translation-glass" style="cursor: pointer;">
        <div class="translation-text" id="translationResult">✨ prêt</div>
      </div>
      <div class="copy-hint" id="copyHintText">↻ cliquer pour copier</div>
    </div>

    <div class="input-section">
      <div class="input-header">
        <span class="input-label" id="inputLabelText">tapez ou parlez (auto‑stop)</span>
        <button id="voiceBtn" class="voice-button">🎤 Parler</button>
      </div>
      <textarea id="sourceInput" rows="2" placeholder="Parlez ou tapez... le micro s'arrête tout seul"></textarea>
      
      <div class="status-row">
        <div class="status-badge" id="statusIndicator">⚡ prêt</div>
        <button id="copyTextBtn" class="copy-action">📋 copier</button>
      </div>

      <div class="example-row" id="exampleContainer"></div>
    </div>
  </div>
</div>

<div id="toastMsg" class="toast">📋 Copié !</div>

<script>
  (function() {
    // ---------- DOM elements ----------
    const sourceTextarea = document.getElementById('sourceInput');
    const translationDiv = document.getElementById('translationResult');
    const translationBox = document.getElementById('translationBox');
    const statusSpan = document.getElementById('statusIndicator');
    const voiceButton = document.getElementById('voiceBtn');
    const copyTextBtn = document.getElementById('copyTextBtn');
    const toastEl = document.getElementById('toastMsg');
    const toggleFrenchBtn = document.getElementById('toggleFrenchBtn');
    const toggleEnglishBtn = document.getElementById('toggleEnglishBtn');
    const subtitleEl = document.getElementById('subtitleText');
    const translationLabel = document.getElementById('translationLabel');
    const copyHintSpan = document.getElementById('copyHintText');
    const inputLabelText = document.getElementById('inputLabelText');
    const exampleContainer = document.getElementById('exampleContainer');
    const refreshNote = document.getElementById('refreshNote');

    // ---------- i18n ----------
    const localeText = {
      fr: {
        subtitle: "FR↔EN · arrêt vocal automatique · traduction précise",
        translationLabel: "traduction",
        copyHint: "↻ cliquer pour copier",
        inputLabel: "tapez ou parlez (auto‑stop)",
        statusReady: "⚡ prêt",
        statusTranslating: "🌐 traduction...",
        statusCached: "✓ (cache persistant)",
        statusError: "⚠️ erreur",
        copyToast: "📋 Copié !",
        voiceListening: "🔴 Écoute... (auto‑stop)",
        voiceSpeak: "🎤 Parler",
        placeholder: "Parlez ou tapez... le micro s'arrête tout seul",
        refreshNote: "⏎ reset après 2min",
        offlineAvailable: "📚 appris hors ligne",
        exampleFrench: "🇫🇷 Bonjour",
        exampleEnglish: "🇬🇧 belle journée",
        exampleFrench2: "🇫🇷 J'aime le design",
        exampleEnglish2: "🇬🇧 style minimal"
      },
      en: {
        subtitle: "FR↔EN · auto‑stop voice · accurate translation",
        translationLabel: "translation",
        copyHint: "↻ click to copy",
        inputLabel: "type or speak (auto‑stop)",
        statusReady: "⚡ ready",
        statusTranslating: "🌐 translating...",
        statusCached: "✓ (persistent cache)",
        statusError: "⚠️ error",
        copyToast: "📋 Copied!",
        voiceListening: "🔴 Listening... (auto‑stop)",
        voiceSpeak: "🎤 Speak",
        placeholder: "Speak or type... mic stops automatically",
        refreshNote: "⏎ reset after 2min",
        offlineAvailable: "📚 learned offline",
        exampleFrench: "🇫🇷 Bonjour",
        exampleEnglish: "🇬🇧 beautiful day",
        exampleFrench2: "🇫🇷 I love design",
        exampleEnglish2: "🇬🇧 minimal style"
      }
    };

    let currentLang = 'fr';

    function updateUI() {
      const t = localeText[currentLang];
      subtitleEl.textContent = t.subtitle;
      translationLabel.textContent = t.translationLabel;
      copyHintSpan.textContent = t.copyHint;
      inputLabelText.textContent = t.inputLabel;
      sourceTextarea.placeholder = t.placeholder;
      refreshNote.textContent = t.refreshNote;
      if (!voiceButton.classList.contains('listening')) {
        voiceButton.innerHTML = `🎙️ ${t.voiceSpeak}`;
      } else {
        voiceButton.innerHTML = `🔴 ${t.voiceListening} <span style="display:inline-block; animation: earWave 0.7s infinite;">👂</span>`;
      }
      updateExamples();
      const currentStatus = statusSpan.innerText;
      if (currentStatus.includes('prêt') || currentStatus.includes('ready')) statusSpan.innerHTML = t.statusReady;
      else if (currentStatus.includes('traduction') || currentStatus.includes('translating')) statusSpan.innerHTML = t.statusTranslating;
      else if (currentStatus.includes('cache')) statusSpan.innerHTML = t.statusCached;
      else if (currentStatus.includes('erreur') || currentStatus.includes('error')) statusSpan.innerHTML = t.statusError;
    }

    function updateExamples() {
      const t = localeText[currentLang];
      exampleContainer.innerHTML = `
        <span class="example-chip" data-example="Bonjour, comment allez-vous ?">${t.exampleFrench}</span>
        <span class="example-chip" data-example="What a beautiful day">${t.exampleEnglish}</span>
        <span class="example-chip" data-example="Je vais au cinéma ce soir">${t.exampleFrench2}</span>
        <span class="example-chip" data-example="I love minimal design">${t.exampleEnglish2}</span>
      `;
      document.querySelectorAll('.example-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const exampleText = chip.getAttribute('data-example');
          if (exampleText) {
            sourceTextarea.value = exampleText;
            if (debounceTimer) clearTimeout(debounceTimer);
            if (currentAbort) currentAbort.abort();
            translateText(exampleText);
            sourceTextarea.focus();
          }
        });
      });
    }

    // ---------- PERSISTENT OFFLINE CACHE (IndexedDB) ----------
    const DB_NAME = 'MelviLensDB';
    const STORE_NAME = 'translations';
    let db = null;

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'original' });
          }
        };
      });
    }

    async function loadFromPersistentCache(original) {
      if (!db) await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const getReq = store.get(original);
        getReq.onsuccess = () => resolve(getReq.result ? getReq.result.translated : null);
        getReq.onerror = () => resolve(null);
      });
    }

    async function saveToPersistentCache(original, translated) {
      if (!db) await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.put({ original, translated });
    }

    // ---------- IMPROVED TRANSLATION API (MyMemory with better quality) ----------
    const API_URL = 'https://api.mymemory.translated.net/get';
    const DEBOUNCE_MS = 280;
    let debounceTimer = null;
    let currentAbort = null;

    function showToast(msg, duration = 1600) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      if (window.toastTimeout) clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    function setStatus(text, isError = false, isCache = false) {
      statusSpan.innerHTML = text;
      statusSpan.style.background = isError ? 'rgba(255, 200, 200, 0.5)' : isCache ? 'rgba(200, 240, 200, 0.5)' : 'rgba(255,255,255,0.4)';
    }

    // Improved language detection
    function detectLanguage(text) {
      if (!text.trim()) return 'fr';
      const lower = text.toLowerCase();
      // Strong French indicators
      const frenchAccents = /[éèêëàâôûçîïœ]/i;
      if (frenchAccents.test(text)) return 'fr';
      // Common French words
      const frenchWords = ['le', 'la', 'les', 'un', 'une', 'de', 'du', 'des', 'et', 'est', 'je', 'tu', 'il', 'elle', 'nous', 'vous', 'ils', 'elles', 'ce', 'cette', 'que', 'qui', 'dans', 'pour', 'par', 'avec', 'sans', 'sur'];
      let frenchScore = 0;
      // Common English words
      const englishWords = ['the', 'and', 'of', 'to', 'in', 'for', 'on', 'with', 'be', 'by', 'this', 'that', 'you', 'are', 'is', 'it', 'have', 'not', 'from', 'or', 'but', 'so', 'as', 'at', 'we', 'they', 'he', 'she'];
      let englishScore = 0;
      const words = lower.split(/\s+/);
      for (let w of words) {
        if (frenchWords.includes(w)) frenchScore++;
        if (englishWords.includes(w)) englishScore++;
      }
      // Heuristic: if many French accents or French words dominate
      if (frenchScore > englishScore + 1) return 'fr';
      if (englishScore > frenchScore + 1) return 'en';
      // Fallback: if no clear winner, check first common word
      if (words.length > 0) {
        const firstWord = words[0];
        if (frenchWords.includes(firstWord)) return 'fr';
        if (englishWords.includes(firstWord)) return 'en';
      }
      return 'fr'; // default to French
    }

    async function translateText(original) {
      const trimmed = original.trim();
      if (trimmed === "") {
        translationDiv.innerText = "✨ " + (currentLang === 'fr' ? "prêt" : "ready");
        setStatus(localeText[currentLang].statusReady);
        return;
      }

      // Check persistent cache first
      const cached = await loadFromPersistentCache(trimmed);
      if (cached) {
        translationDiv.innerText = cached;
        setStatus(localeText[currentLang].statusCached, false, true);
        return;
      }

      const sourceLang = detectLanguage(trimmed);
      const targetLang = sourceLang === 'fr' ? 'en' : 'fr';
      const langPair = `${sourceLang}|${targetLang}`;
      const directionIcon = sourceLang === 'fr' ? '🇫🇷→🇬🇧' : '🇬🇧→🇫🇷';

      if (currentAbort) currentAbort.abort();
      const controller = new AbortController();
      currentAbort = controller;
      setStatus(`${localeText[currentLang].statusTranslating} ${directionIcon}`);
      translationDiv.innerText = "🔄 ...";

      try {
        // Use MyMemory with 'mt=1' for machine translation, and 'de' for better rate limits
        const params = new URLSearchParams({
          q: trimmed,
          langpair: langPair,
          de: 'melvilens@demo.com',
          mt: '1'
        });
        const response = await fetch(`${API_URL}?${params.toString()}`, { signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        let translated = data?.responseData?.translatedText;
        
        // Fallback if translation is missing or identical
        if (!translated || translated === trimmed) {
          // Try a fallback: use LibreTranslate demo (sometimes more accurate)
          try {
            const libreUrl = 'https://libretranslate.com/translate';
            const libreResponse = await fetch(libreUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                q: trimmed,
                source: sourceLang,
                target: targetLang,
                format: 'text'
              }),
              signal: controller.signal
            });
            if (libreResponse.ok) {
              const libreData = await libreResponse.json();
              if (libreData.translatedText) translated = libreData.translatedText;
            }
          } catch (e) { /* fallback already handled */ }
        }
        
        // Final fallback
        if (!translated || translated === trimmed) {
          translated = (sourceLang === 'fr') 
            ? "⚠️ Traduction non disponible (vérifiez votre connexion)" 
            : "⚠️ Translation unavailable (check your connection)";
        }
        
        // Clean HTML entities
        let clean = translated.replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
        translationDiv.innerText = clean;
        // Save to persistent cache for offline use
        await saveToPersistentCache(trimmed, clean);
        setStatus(`✓ ${directionIcon}`, false, false);
        showToast(localeText[currentLang].offlineAvailable, 1200);
      } catch (err) {
        if (err.name === 'AbortError') return;
        console.warn(err);
        translationDiv.innerText = "⚠️ " + (currentLang === 'fr' ? "hors ligne · non appris" : "offline · not learned");
        setStatus(localeText[currentLang].statusError, true);
      } finally {
        if (currentAbort === controller) currentAbort = null;
      }
    }

    function handleInput() {
      resetInactivityTimer();
      const val = sourceTextarea.value;
      if (debounceTimer) clearTimeout(debounceTimer);
      if (val.trim() === "") {
        translationDiv.innerText = "✨ " + (currentLang === 'fr' ? "prêt" : "ready");
        setStatus(localeText[currentLang].statusReady);
        if (currentAbort) currentAbort.abort();
        return;
      }
      debounceTimer = setTimeout(() => translateText(val), DEBOUNCE_MS);
    }

    // ---------- AUTO-STOP VOICE (stops when speaking ends) ----------
    let recognition = null;
    let isListening = false;
    let silenceTimer = null;
    const SILENCE_DELAY = 1500; // 1.5 seconds of silence → auto-stop

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        voiceButton.disabled = true;
        voiceButton.style.opacity = '0.5';
        showToast("Voice not supported in this browser", 2000);
        return null;
      }
      const recog = new SpeechRecognition();
      recog.continuous = true;       // Keep listening for multiple phrases
      recog.interimResults = true;   // Get partial results to detect silence
      recog.lang = 'fr-FR';          // Works for both French and English
      recog.maxAlternatives = 1;
      return recog;
    }

    function resetSilenceTimer() {
      if (silenceTimer) clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        if (isListening && recognition) {
          // No speech detected for SILENCE_DELAY → auto-stop
          recognition.stop();
          showToast(currentLang === 'fr' ? "🎤 Silence détecté, arrêt automatique" : "🎤 Silence detected, auto-stopping", 1500);
        }
      }, SILENCE_DELAY);
    }

    function startVoice() {
      if (recognition) recognition.abort();
      recognition = initSpeechRecognition();
      if (!recognition) return;

      recognition.onstart = () => {
        isListening = true;
        voiceButton.classList.add('listening');
        voiceButton.innerHTML = `🔴 ${localeText[currentLang].voiceListening} <span style="display:inline-block; animation: earWave 0.7s infinite;">👂</span>`;
        showToast(currentLang === 'fr' ? "🎤 Parlez maintenant (arrêt automatique)" : "🎤 Speak now (auto-stop)", 2000);
        resetSilenceTimer();
      };

      recognition.onerror = (event) => {
        if (event.error === 'aborted') return;
        isListening = false;
        voiceButton.classList.remove('listening');
        voiceButton.innerHTML = `🎙️ ${localeText[currentLang].voiceSpeak}`;
        showToast(`🎤 ${event.error === 'not-allowed' ? 'Microphone access denied' : 'Error, try again'}`, 1500);
        if (silenceTimer) clearTimeout(silenceTimer);
      };

      recognition.onend = () => {
        isListening = false;
        voiceButton.classList.remove('listening');
        voiceButton.innerHTML = `🎙️ ${localeText[currentLang].voiceSpeak}`;
        if (silenceTimer) clearTimeout(silenceTimer);
      };

      recognition.onresult = (event) => {
        // Reset silence timer on any speech activity
        resetSilenceTimer();
        
        // Process final results only
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            const transcript = event.results[i][0].transcript.trim();
            if (transcript) {
              sourceTextarea.value = transcript;
              resetInactivityTimer(); // user activity via voice
              if (debounceTimer) clearTimeout(debounceTimer);
              if (currentAbort) currentAbort.abort();
              translateText(transcript);
              showToast(`👂 "${transcript.substring(0, 40)}"`, 1200);
            }
          }
        }
      };
      recognition.start();
    }

    function stopVoice() {
      if (recognition) {
        recognition.stop(); // triggers onend
      }
    }

    function toggleVoice() {
      if (isListening) {
        stopVoice();
      } else {
        startVoice();
      }
    }

    // ---------- AUTO-REFRESH AFTER INACTIVITY (2 minutes) ----------
    let inactivityTimer = null;
    const INACTIVITY_LIMIT = 120000;

    function resetInactivityTimer() {
      if (inactivityTimer) clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(() => {
        sourceTextarea.value = "";
        translationDiv.innerText = "✨ " + (currentLang === 'fr' ? "prêt" : "ready");
        setStatus(localeText[currentLang].statusReady);
        if (currentAbort) currentAbort.abort();
        if (debounceTimer) clearTimeout(debounceTimer);
        showToast(currentLang === 'fr' ? "🔄 Réinitialisation auto (inactivité)" : "🔄 Auto-refresh (inactivity)", 2000);
      }, INACTIVITY_LIMIT);
    }

    function bindActivityEvents() {
      const events = ['click', 'keydown', 'input', 'touchstart'];
      events.forEach(ev => document.addEventListener(ev, resetInactivityTimer));
      resetInactivityTimer();
    }

    // Copy translation
    async function copyTranslation() {
      const text = translationDiv.innerText;
      if (!text || text.includes("✨") || text.includes("🔄") || text.includes("⚠️")) {
        showToast(currentLang === 'fr' ? "Rien à copier" : "Nothing to copy", 1000);
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast(localeText[currentLang].copyToast, 1200);
        setStatus(localeText[currentLang].statusReady);
      } catch (err) {
        showToast("❌ Copy failed", 1000);
      }
    }

    // Language toggle
    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'fr') {
        toggleFrenchBtn.classList.add('active');
        toggleEnglishBtn.classList.remove('active');
      } else {
        toggleEnglishBtn.classList.add('active');
        toggleFrenchBtn.classList.remove('active');
      }
      updateUI();
      if (sourceTextarea.value.trim() === "") setStatus(localeText[currentLang].statusReady);
      else setStatus(localeText[currentLang].statusReady);
    }

    // ---------- Initialization ----------
    async function init() {
      await openDB();
      bindActivityEvents();
      sourceTextarea.addEventListener('input', handleInput);
      voiceButton.addEventListener('click', toggleVoice);
      copyTextBtn.addEventListener('click', copyTranslation);
      translationBox.addEventListener('click', copyTranslation);
      toggleFrenchBtn.addEventListener('click', () => setLanguage('fr'));
      toggleEnglishBtn.addEventListener('click', () => setLanguage('en'));
      setLanguage('fr');
      updateExamples();
    }

    init();
  })();
</script>
</body>
</html>
